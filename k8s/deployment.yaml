apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-api
  labels:
    app: triage-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-api
  template:
    metadata:
      labels:
        app: triage-api
    spec:
      containers:
        - name: api
          image: triage-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "16"
              memory: 64Gi
            limits:
              cpu: "16"
              memory: 64Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
